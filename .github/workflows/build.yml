name: Build and Release

on:
  push:
    branches: [main, dev]  # main: build + test + publish.  dev: build + test only.
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive   # pulls in JUCE submodule

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          # Version is single-sourced from CMakeLists.txt: project(Hawthorne VERSION x.y.z)
          VER=$(grep -oP 'project\(Hawthorne VERSION \K[0-9.]+' CMakeLists.txt)
          TAG="v$VER"
          echo "tag=$TAG"   >> $GITHUB_OUTPUT
          echo "ver=$VER"   >> $GITHUB_OUTPUT

      - name: Fetch ASIO SDK
        id: asio
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip -MaximumRedirection 10
          Expand-Archive asiosdk.zip -DestinationPath asiosdk_tmp -Force
          $h = Get-ChildItem asiosdk_tmp -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if (-not $h) { throw "iasiodrv.h not found in ASIO SDK" }
          $root = $h.Directory.Parent.FullName -replace '\\','/'
          "ASIO_SDK=$root" >> $env:GITHUB_ENV

      - name: Warn if ASIO missing
        if: steps.asio.outcome != 'success'
        shell: bash
        run: echo "::warning::ASIO SDK download failed - building with WASAPI/DirectSound only"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -A x64 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DHAWTHORNE_BUILD_TESTS=ON \
            -DHAWTHORNE_ASIO_SDK="${ASIO_SDK:-}" 2>&1 | tee configure.log
          grep -q "ASIO enabled" configure.log && echo "::notice::ASIO enabled" || true

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error [A-Z]+[0-9]+|fatal error" build.log | sort -u | head -20 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Engine tests (must pass to ship)
        shell: bash
        env:
          HAWTHORNE_TEST_SPEED: "4"
        run: |
          set +e
          ./build/HawthorneEngineTests_artefacts/Release/HawthorneEngineTests.exe 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          grep -E "FAIL|^\[" tests.log | while IFS= read -r l; do
            case "$l" in *FAIL*) echo "::error::$l";; *) echo "::notice::$l";; esac
          done
          exit $status

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$ver" installer\Hawthorne.iss *>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content iscc.log -Tail 40) -join "%0A"; Write-Output "::error title=installer::$msg"
            exit 1
          }
          Get-ChildItem dist

      - name: Release notes (first line = what the in-app updater shows)
        shell: bash
        run: git log -1 --pretty=%s > notes.md

      # Push installer to the public releases repo
      - name: Publish to Hawthorne-Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.RELEASES_PAT }}
          repo: Hawthorne-Releases
          owner: ShallowMouse
          tag: ${{ steps.version.outputs.tag }}
          name: Hawthorne ${{ steps.version.outputs.ver }}
          bodyFile: notes.md
          artifacts: dist/Hawthorne-Setup-${{ steps.version.outputs.ver }}.exe
          artifactContentType: application/octet-stream
          allowUpdates: true
          draft: false
          prerelease: false
