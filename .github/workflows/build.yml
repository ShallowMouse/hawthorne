name: Build and Release

on:
  push:
    branches: [main]  # Every push to main builds + publishes
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls in JUCE submodule

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          # Version is single-sourced from CMakeLists.txt: project(Hawthorne VERSION x.y.z)
          VER=$(grep -oP 'project\(Hawthorne VERSION \K[0-9.]+' CMakeLists.txt)
          TAG="v$VER"
          echo "tag=$TAG"   >> $GITHUB_OUTPUT
          echo "ver=$VER"   >> $GITHUB_OUTPUT

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -A x64 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error [A-Z]+[0-9]+|fatal error" build.log | sort -u | head -20 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Patch version into NSIS script
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver }}"
          (Get-Content installer/hawthorne.nsi) `
            -replace '!define APP_VERSION.*', "!define APP_VERSION `"$ver`"" |
            Set-Content installer/hawthorne.nsi

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: bash
        run: |
          "/c/Program Files (x86)/NSIS/makensis.exe" installer/hawthorne.nsi

      - name: Rename installer with version
        shell: bash
        run: |
          mv installer/Hawthorne-Setup-${{ steps.version.outputs.ver }}.exe \
             Hawthorne-Setup-${{ steps.version.outputs.ver }}.exe

      # ── Push installer to the public releases repo ──────────────────────────
      - name: Publish to Hawthorne-Releases
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.RELEASES_PAT }}
          repo: Hawthorne-Releases
          owner: ShallowMouse
          tag: ${{ steps.version.outputs.tag }}
          name: Hawthorne ${{ steps.version.outputs.ver }}
          body: |
            ## Hawthorne ${{ steps.version.outputs.ver }}

            ### Install
            Download `Hawthorne-Setup-${{ steps.version.outputs.ver }}.exe` and run it.

            ### Changes
            <!-- Add release notes here -->
          artifacts: Hawthorne-Setup-${{ steps.version.outputs.ver }}.exe
          artifactContentType: application/octet-stream
          allowUpdates: true
          draft: false
          prerelease: false
